name: HomeMedicine
options:
  bundleIdPrefix: com.homemedicine
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: QZ4K2F8H93
    INFOPLIST_KEY_CFBundleDisplayName: Home Medicine
    INFOPLIST_KEY_NSCameraUsageDescription: Capture medicine box photos for AI recognition.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select medicine photos.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Record voice input for storage location and notes.
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Convert speech to text for storage location and notes.
    INFOPLIST_KEY_NSUserNotificationsUsageDescription: Send intake reminders and expiry alerts for your medicines.
    INFOPLIST_KEY_UIBackgroundModes: remote-notification
packages: {}
targets:
  HomeMedicine:
    type: application
    platform: iOS
    entitlements:
      path: HomeMedicine/HomeMedicine.entitlements
    sources:
      - path: HomeMedicine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homemedicine.app
        CODE_SIGN_ENTITLEMENTS: HomeMedicine/HomeMedicine.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: HomeMedicine/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_CFBundleLocalizations: "(en, zh-Hans, ja, es, de, fr, pt-BR, ko, it, ru, ar, zh-Hant, tr, nl, hi, pl, id, th, vi, sv, ms, da, fi, nb, el, cs)"
        INFOPLIST_KEY_CloudKitContainerIdentifier: iCloud.com.homemedicine.app
    dependencies: []
  HomeMedicineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HomeMedicineTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homemedicine.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HomeMedicine
  HomeMedicineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HomeMedicineUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homemedicine.app.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HomeMedicine
schemes:
  HomeMedicine:
    build:
      targets:
        HomeMedicine: all
    run:
      storeKitConfiguration: HomeMedicine/Resources/Products.storekit
    test:
      targets:
        - HomeMedicineTests
        - HomeMedicineUITests
      gatherCoverageData: true
